<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Leonardo Gonzalez, Google Cloud Architect and Workspace Specialist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="55%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F1A33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="24"/></clipPath>
    <style>
      .name{font:700 58px "Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#F8FAFC;letter-spacing:-1px}
      .sub{font:500 22px "Segoe UI",Inter,Helvetica,Arial,sans-serif;fill:#94A3B8;letter-spacing:0.5px}
      .mono{font:500 15px "JetBrains Mono","Cascadia Code",Consolas,monospace;fill:#38BDF8}
      .tag{font:600 13px "JetBrains Mono","Cascadia Code",Consolas,monospace;fill:#CBD5E1;letter-spacing:1px}
      .dot{fill:#38BDF8}
      .float1{animation:f1 9s ease-in-out infinite}
      .float2{animation:f2 12s ease-in-out infinite}
      .float3{animation:f3 10s ease-in-out infinite}
      .blink{animation:blink 1.1s steps(2,start) infinite}
      .rise{opacity:1}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}
      @keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-14px)}}
      @keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,12px)}}
      @keyframes f3{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,20px)}}
      @keyframes blink{to{opacity:0}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="float1" cx="960" cy="90" r="220" fill="url(#glow1)"/>
    <circle class="float2" cx="1120" cy="280" r="200" fill="url(#glow2)"/>
    <circle class="float3" cx="120" cy="300" r="180" fill="url(#glow2)"/>

    <!-- constellation -->
    <g stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1" class="float2">
      <line x1="820" y1="70" x2="905" y2="120"/><line x1="905" y1="120" x2="990" y2="80"/>
      <line x1="905" y1="120" x2="930" y2="205"/><line x1="930" y1="205" x2="1040" y2="180"/>
      <line x1="990" y1="80" x2="1040" y2="180"/><line x1="1040" y1="180" x2="1110" y2="240"/>
      <line x1="930" y1="205" x2="870" y2="260"/><line x1="990" y1="80" x2="1090" y2="50"/>
    </g>
    <g class="float2">
      <circle class="dot" cx="820" cy="70" r="3"/><circle class="dot" cx="905" cy="120" r="4"/>
      <circle class="dot" cx="990" cy="80" r="3.5"/><circle class="dot" cx="930" cy="205" r="4"/>
      <circle class="dot" cx="1040" cy="180" r="3"/><circle class="dot" cx="1110" cy="240" r="3"/>
      <circle class="dot" cx="870" cy="260" r="2.5"/><circle class="dot" cx="1090" cy="50" r="2.5"/>
    </g>

    <!-- text -->
    <text class="mono rise d1" x="64" y="92">~/leonardo $ whoami<tspan class="blink" fill="#38BDF8">▍</tspan></text>
    <text class="name rise d2" x="62" y="160">Leonardo Gonzalez</text>
    <text class="sub rise d3" x="64" y="198">Google Cloud Architect  ·  Workspace Specialist  ·  Email Deliverability</text>

    <g class="rise d4">
      <rect x="64" y="228" width="196" height="30" rx="15" fill="#38BDF8" fill-opacity="0.10" stroke="#38BDF8" stroke-opacity="0.45"/>
      <text class="tag" x="84" y="248">EL SALVADOR · LATAM</text>
      <rect x="272" y="228" width="132" height="30" rx="15" fill="#818CF8" fill-opacity="0.10" stroke="#818CF8" stroke-opacity="0.45"/>
      <text class="tag" x="292" y="248">4x GCP CERTS</text>
      <rect x="416" y="228" width="176" height="30" rx="15" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.45"/>
      <circle cx="436" cy="243" r="4" fill="#34D399"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text class="tag" x="448" y="248">OPEN TO WORK</text>
    </g>

    <rect x="0" y="314" width="1200" height="6" fill="url(#accent)"/>
  </g>
</svg>
